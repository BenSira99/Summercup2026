<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé Fond Royal Sombre -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Dégradé Or Royal Principal -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Dégradé Or Éclatant -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Ombre portée douce -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond arrondi stylisé -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-opacity="0.5"/>

  <g filter="url(#dropShadow)">
    <!-- Socle du Trophée -->
    <path d="M192 416h128v24H192z" fill="url(#goldGradient)"/>
    <path d="M160 440h192v24H160z" fill="url(#goldLight)"/>

    <!-- Pied du Trophée -->
    <path d="M240 336h32v80h-32z" fill="url(#goldGradient)"/>
    <path d="M220 320h72v20h-72z" fill="url(#goldLight)"/>

    <!-- Coupe du Trophée Royale -->
    <path d="M144 120h224v96c0 61.86-50.14 112-112 112s-112-50.14-112-112v-96z" fill="url(#goldGradient)"/>
    <path d="M160 136h192v80c0 53.02-42.98 96-96 96s-96-42.98-96-96v-80z" fill="url(#goldLight)" opacity="0.3"/>

    <!-- Poignées de la Coupe -->
    <path d="M144 144H104c-17.67 0-32 14.33-32 32v24c0 35.35 28.65 64 64 64h8v-32h-8c-17.67 0-32-14.33-32-32v-24c0-4.42 3.58-8 8-8h32v-24z" fill="url(#goldGradient)"/>
    <path d="M368 144h40c17.67 0 32 14.33 32 32v24c0 35.35-28.65 64-64 64h-8v-32h8c17.67 0 32-14.33 32-32v-24c0-4.42-3.58-8-8-8h-32v-24z" fill="url(#goldGradient)"/>

    <!-- Étoile du Gagnant au centre -->
    <path d="M256 160l14.8 30 33.1 4.8-24 23.4 5.7 33-29.6-15.6-29.6 15.6 5.7-33-24-23.4 33.1-4.8z" fill="#ffffff"/>

    <!-- Ticket Doré Volant à Droite -->
    <g transform="translate(320, 80) rotate(15)">
      <rect width="96" height="56" rx="8" fill="url(#goldLight)" stroke="#b45309" stroke-width="3"/>
      <circle cx="0" cy="28" r="8" fill="#0f172a"/>
      <circle cx="96" cy="28" r="8" fill="#0f172a"/>
      <line x1="24" y1="16" x2="72" y2="16" stroke="#b45309" stroke-width="4" stroke-dasharray="4 4"/>
      <text x="48" y="40" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#78350f" text-anchor="middle">TK</text>
    </g>

    <!-- Étincelles Magiques -->
    <path d="M120 80l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#fef08a"/>
    <path d="M380 320l8 18 18 8-18 8-8 18-8-18-18-8 18-8z" fill="#fef08a"/>
  </g>
</svg>
